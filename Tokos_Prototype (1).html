<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tokos Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: dark-green sidebar + light work surface on desktop; app bar + bottom tab bar on phones. Single light theme by choice (product UI in NOVA green). */
:root{
  color-scheme: light;
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#F8FAF9; --ink:#0F1F19; --ink-2:#2A3A33; --muted:#5E6E67; --faint:#8A9892; --line:#E1E8E4; --line-2:#ECF1EE;
  --brand:#0F6E56; --brand-ink:#0B5644; --brand-deep:#0A2E25; --brand-deep-2:#113D31; --brand-soft:#E2F1EB; --brand-tint:#F0F8F4;
  --accent:#D06B3F; --accent-soft:#FBEDE4; --accent-ink:#A8502A;
  --ok:#1F8A5B; --ok-soft:#E3F4EB; --warn:#B7791F; --warn-soft:#FBF1DD; --bad:#C2413A; --bad-soft:#FBE7E5; --info:#2F6FB3; --info-soft:#E6EFF9;
  --ch-private:#0F6E56; --ch-medicaid:#2F6FB3; --ch-commercial:#7B5CC4; --ch-employer:#C58A1F;
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-ui:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(15,31,25,.04), 0 6px 24px -12px rgba(15,31,25,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
html,:root,:root[data-theme]{color-scheme:light}
input,select,textarea{background-color:var(--surface);color:var(--ink);font:inherit}
input::placeholder,textarea::placeholder{color:var(--faint)}
a{color:inherit}
.num,.tab-nums{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:linear-gradient(180deg,#0B3329 0%,var(--brand-deep) 55%,#082520 100%);color:#DCEBE4;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 16px;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#1C8B6D,#0F6E56);display:grid;place-items:center;color:#fff;font:600 15px var(--f-display);font-size:19px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.brand-name{font:400 23px/1 var(--f-display);color:#fff;letter-spacing:.01em}
.brand-sub{font-size:11px;color:#8FB3A5;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.ws{background:var(--brand-deep-2);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.ws .av{width:30px;height:30px;border-radius:8px;background:#E2F1EB;color:var(--brand-deep);display:grid;place-items:center;font-weight:600;font-size:12px}
.ws b{display:block;color:#fff;font-weight:600;font-size:13.5px}
.ws span{font-size:12px;color:#8FB3A5}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6F978A;padding:10px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:#C7DDD4;font-size:14px}
.nav button svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:#1A4A3C;color:#fff;box-shadow:inset 3px 0 0 #6FD3AE}
.nav .count{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-weight:600}
.optb{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8A4B1F;background:#FBE8DA;border:1px solid #F1C9A9;border-radius:999px;padding:1px 8px;vertical-align:middle;white-space:nowrap}
.optnote{display:flex;gap:10px;align-items:flex-start;border:1px solid #BFE0D3;background:var(--brand-tint);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink-2);margin-bottom:14px}
.optnote .optb{margin-top:2px;flex:0 0 auto}
.nav .tagx.optn{color:#F4B88E;border-color:rgba(244,184,142,.45)}
.site{min-height:100vh;background:var(--bg)}
.site-bar{background:var(--brand-tint);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2);padding:6px 16px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.site-top{display:flex;align-items:center;gap:16px;padding:16px 32px;max-width:1180px;margin:0 auto}
.site-top nav{display:flex;gap:18px;margin-left:auto;align-items:center;flex-wrap:wrap}
.site-top nav button{all:unset;cursor:pointer;font-size:14px;color:var(--ink-2)}
.site-top nav button:hover{color:var(--brand)}
.site-hero{max-width:1180px;margin:0 auto;padding:40px 32px 28px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center}
.site-hero h1{font:400 54px/1.02 var(--f-display);margin:0 0 14px;letter-spacing:-.01em}
.site-hero h1 em{color:var(--brand)}
.site-hero p{font-size:17px;color:var(--ink-2);max-width:52ch;margin:0 0 20px}
.site-hero .art{background:var(--brand-deep);border-radius:24px;min-height:280px;position:relative;overflow:hidden;color:#DCEBE4;padding:26px;display:flex;flex-direction:column;justify-content:flex-end}
.site-hero .art::after{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-160px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#1C8B6D 0%,rgba(15,110,86,.25) 45%,transparent 70%)}
.site-sec{max-width:1180px;margin:0 auto;padding:28px 32px}
.site-sec h2{font:400 34px/1.1 var(--f-display);margin:0 0 6px}
.site-sec .lead{color:var(--muted);margin:0 0 18px}
.feat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.feat3 .card h3{margin:8px 0 4px}
.dir-filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.msel{position:relative}
.msel summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 34px 10px 12px;background:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.msel summary::-webkit-details-marker{display:none}
.msel summary::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.msel[open] summary{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,110,86,.12)}
.msel summary.on{border-color:#BFE0D3;background:var(--brand-tint);color:var(--brand-ink);font-weight:600}
.msel-pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.msel-pop label{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.msel-pop label:hover{background:var(--surface-2)}
.dir-filters .msel-pop input{accent-color:var(--brand);width:16px;height:16px;padding:0;border:0;flex:0 0 auto;margin:0}
.dir-filters .msel:nth-child(4) .msel-pop{left:auto;right:0}
@media (max-width:820px){.dir-filters .msel:nth-child(4) .msel-pop{left:0;right:auto}.dir-filters .msel:nth-child(3) .msel-pop{left:auto;right:0}}
.msel-pop .msel-f{display:flex;justify-content:space-between;border-top:1px solid var(--line-2);margin-top:4px;padding:6px 4px 2px}
.dir-chips{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px}
.dir-chips button{all:unset;cursor:pointer;font-size:12.5px;background:var(--brand-tint);color:var(--brand-ink);border:1px solid #BFE0D3;border-radius:999px;padding:4px 10px}
.dir-filters input,.dir-filters select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.dir-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dir-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.dir-card .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:600}
.dir-tags{display:flex;gap:6px;flex-wrap:wrap}
.dir-tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink-2);background:var(--surface-2)}
.site-form{max-width:820px;margin:0 auto;padding:24px 32px 60px}
.site-form .card{margin-bottom:14px}
.site-form h3{margin:0 0 10px}
.chk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chk3 label,.radios label{display:flex;gap:8px;align-items:center;font-size:13.5px}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.site-foot{border-top:1px solid var(--line);padding:24px 32px;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:820px){
  .site-top{padding:12px 16px}.site-top nav{gap:12px;flex-wrap:nowrap}.site-top nav .hide-sm{display:none}
  .site-hero{grid-template-columns:1fr;padding:20px 16px}.site-hero h1{font-size:38px}
  .site-sec{padding:20px 16px}.feat3,.dir-grid{grid-template-columns:1fr}.dir-filters{grid-template-columns:1fr 1fr}.dir-filters .full{grid-column:1/-1}
  .site-form{padding:16px 16px 48px}.chk3{grid-template-columns:1fr 1fr}.f2,.f3{grid-template-columns:1fr}
}
.nav .tagx{margin-left:auto;font-size:10px;border:1px solid rgba(255,255,255,.18);color:#9DC0B3;border-radius:999px;padding:0 6px}
.side-foot{margin-top:auto;font-size:11.5px;color:#7FA394;padding:0 8px;line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(243,246,244,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--faint)}
.search input{all:unset;flex:1;color:var(--ink);font-size:14px}
.top-sp{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.toggle{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.toggle .sw{width:28px;height:16px;border-radius:999px;background:#CFD9D4;position:relative;transition:.15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}
.toggle[aria-pressed="true"]{border-color:#E9C27A;background:#FFF8EA}
.toggle[aria-pressed="true"] .sw{background:#E2A43B}
.toggle[aria-pressed="true"] .sw::after{left:14px}
.iconbtn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);position:relative}
.iconbtn svg{width:17px;height:17px}
.dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff}
.me{width:34px;height:34px;border-radius:50%;background:#F2D9C9;color:#7A3B1E;display:grid;place-items:center;font-weight:600;font-size:12.5px}

.page{padding:26px 28px 160px;max-width:1240px;width:100%}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:600}
.ph h1{font:400 42px/1.04 var(--f-display);margin:4px 0 0;letter-spacing:-.005em;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;font-weight:550;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#C9D5CF}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn svg{width:15px;height:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 1px 0 rgba(15,31,25,.03)}
.card h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h .r{margin-left:auto}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}

.kpi{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden}
.card.kpi::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--brand),#6FD3AE);opacity:0;transition:opacity .15s}
.card.kpi:hover::after{opacity:1}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font:600 27px/1 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .d.up{color:var(--ok)} .kpi .d.warn{color:var(--accent-ink)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;line-height:1.35}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.mute{background:var(--line-2);color:var(--muted)} .pill.brand{background:var(--brand-soft);color:var(--brand-ink)}
.pill.plain::before{display:none}
.chan{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.chan i{width:8px;height:8px;border-radius:2px;display:inline-block}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-2);min-width:0}
.row:first-child{border-top:0}
.row .t{font-weight:550} .row .m{font-size:12.5px;color:var(--muted)}
.row .grow{flex:1;min-width:0}
.row .end{margin-left:auto;text-align:right;flex:0 0 auto}
@media (max-width:820px){.row{gap:10px}.row .attn-ic{width:28px;height:28px}}
.clickable{cursor:pointer;border-radius:10px}
.clickable:hover{background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:0 0 auto}
.attn{border-left:3px solid var(--accent);padding-left:12px;margin-left:-3px}
.attn-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.attn-ic svg{width:16px;height:16px}

.bar{height:10px;border-radius:999px;background:var(--line-2);display:flex;overflow:hidden}
.bar span{height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:10px 12px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brand);font-weight:600}
.tabs .n{font-size:11px;background:var(--line-2);border-radius:999px;padding:0 6px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:default}
tbody tr.link{cursor:pointer} tbody tr.link:hover td{background:var(--brand-tint)}
td.r,th.r{text-align:right}

/* kanban */
.board{display:grid;grid-template-columns:repeat(9,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0;scroll-snap-align:start}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:600;font-size:13px}
.col-h .c{color:var(--faint);font-weight:500}
.col-h .bul{width:8px;height:8px;border-radius:50%}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:border-color .12s, transform .12s}
.kc:hover{border-color:#B9CBC3;transform:translateY(-1px)}
.kc .n{font-weight:600}
.kc .meta{font-size:12px;color:var(--muted)}
.kc .foot{display:flex;align-items:center;gap:8px;justify-content:space-between}
.flagline{font-size:11.5px;color:var(--accent-ink)}

/* schedule */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:170px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.day-h{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.day-h b{font-size:18px;color:var(--ink);font-weight:600}
.ev{border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.35;border-left:3px solid;cursor:pointer}
.ev b{display:block;font-weight:600;font-size:12.5px}
.ev.prenatal{background:#EAF2FB;border-color:#2F6FB3}
.ev.birth{background:#FBEDE4;border-color:#D06B3F}
.ev.postpartum{background:#EEF7F2;border-color:#1F8A5B}
.ev.consult{background:#F3EFFB;border-color:#7B5CC4}
.ev.class{background:#FBF4E4;border-color:#C58A1F}
.oncall{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.oncall:first-of-type{border-top:0}
.track{position:relative;height:26px;background:var(--surface-2);border-radius:7px;border:1px solid var(--line-2)}
.seg-on{position:absolute;top:3px;bottom:3px;border-radius:5px;font-size:11px;color:#fff;display:flex;align-items:center;padding:0 7px;white-space:nowrap;overflow:hidden}
.seg-gap{background:repeating-linear-gradient(135deg,#FBE7E5,#FBE7E5 6px,#F6D2CE 6px,#F6D2CE 12px);color:var(--bad);font-weight:600;border:1px dashed #E6A39C}

/* client */
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.journey{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.jstep{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:8px 7px;background:var(--surface);position:relative}
.jstep:hover{border-color:#B9CBC3}
.jstep .jn{font-size:11px;color:var(--faint);font-weight:600}
.jstep b{display:block;font-size:12.5px;line-height:1.2;margin-top:1px}
.jstep span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.jstep.done{background:var(--brand-tint);border-color:#BFE0D3}
.jstep.done .jn{color:var(--brand)}
.jstep.cur{background:var(--brand);border-color:var(--brand);color:#fff}
.jstep.cur span,.jstep.cur .jn{color:#CFE9DE}
.ftabs-note{font-size:13.5px;color:var(--ink-2);margin:-6px 0 14px}
@media (max-width:1080px){.journey{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:820px){.journey{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stepper span{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--faint);background:var(--surface)}
.stepper span.done{color:var(--brand-ink);border-color:#BFE0D3;background:var(--brand-tint)}
.stepper span.cur{color:#fff;background:var(--brand);border-color:var(--brand);font-weight:600}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:9px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:1.5px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:12px;height:12px;border-radius:50%;border:2px solid var(--brand);background:#fff;margin-top:4px}
.tl .m{font-size:12px;color:var(--muted)}

/* assistant */
.draft{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.draft + .draft{margin-top:12px}
.draft .ic{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,#E7F4EE,#D4ECE1);display:grid;place-items:center;color:var(--brand)}
.draft .ic svg{width:19px;height:19px}
.draft .body{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-2);white-space:pre-line;margin:10px 0}
.draft .acts{display:flex;gap:8px;flex-wrap:wrap}
.draft.done{opacity:.6}
.ai-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#5B45A8;background:#F0ECFB;border-radius:999px;padding:2px 8px}

/* scoping notes */
.q{display:none}
body.scoping .q{display:flex}
.q{gap:10px;align-items:flex-start;background:#FFF8EA;border:1px solid #F0D49B;border-radius:12px;padding:10px 12px;font-size:13px;color:#5B4210;margin:10px 0}
.q .qn{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#E2A43B;color:#fff;font-weight:700;font-size:11.5px;display:grid;place-items:center}
.q b{color:#3F2D07}
.q.answered{background:var(--ok-soft);border-color:#BFE0D3;color:#1E4D3A}.q.answered .qn{background:var(--ok)}.q.answered b{color:#123A2B}

/* signup */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.auth-l{background:var(--brand-deep);color:#DCEBE4;padding:44px 48px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.auth-l::after{content:"";position:absolute;width:560px;height:560px;right:-220px;bottom:-240px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#1C8B6D 0%,rgba(15,110,86,.25) 45%,transparent 70%)}
.auth-l h2{font:400 46px/1.02 var(--f-display);color:#fff;margin:auto 0 0;max-width:13ch;position:relative;z-index:1}
.auth-l h2 em{color:#8FE0BF}
.auth-l p{max-width:40ch;color:#A9C8BC;position:relative;z-index:1;margin:0}
.chips4{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.chips4 span{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;font-size:12.5px;color:#D3E6DE;display:inline-flex;gap:7px;align-items:center}
.chips4 i{width:8px;height:8px;border-radius:2px}
.auth-r{padding:44px 56px;display:flex;flex-direction:column;justify-content:center;max-width:620px;width:100%}
.steps{display:flex;gap:6px;margin-bottom:26px}
.steps i{height:4px;flex:1;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--brand)}
.auth-r h1{font:400 36px/1.08 var(--f-display);margin:0 0 6px}
.auth-r .lead{color:var(--muted);margin:0 0 22px}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:16px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:8px;transition:.12s}
.opt:hover{border-color:#B9CBC3}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);box-shadow:0 0 0 3px rgba(15,110,86,.12)}
.opt .oi{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.opt .oi svg{width:20px;height:20px}
.opt b{font-size:15.5px}
.opt span{color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);width:100%}
.field input[type=radio],.field input[type=checkbox]{width:16px;height:16px;padding:0;border:0;margin:0;flex:0 0 auto;accent-color:var(--brand)}
.bk-chips{display:flex;gap:8px;flex-wrap:wrap}
.bk-chip{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;background:var(--surface)}
.bk-chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink);font-weight:600}
.bk-days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bk-day{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.bk-day b{display:block;font-size:13.5px;margin-bottom:8px}
.bk-day .bk-chip{display:block;width:100%;box-sizing:border-box;text-align:center;padding:8px 6px;margin-top:6px;font-size:13.5px}
@media (max-width:820px){.bk-days{grid-template-columns:minmax(0,1fr)}.bk-day{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bk-day b{width:100%;margin:0}.bk-day .bk-chip{margin:0;flex:1}}
.field .hint{font-size:12px;color:var(--faint)}
.chk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chk label{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;font-size:13.5px}
.chk input{accent-color:var(--brand);width:16px;height:16px}
.me{border:0;cursor:pointer;padding:0;font-family:inherit} .me:hover{box-shadow:0 0 0 3px var(--brand-soft)}
.txtlink{all:unset;cursor:pointer;color:var(--brand);font-weight:600} .txtlink:hover{text-decoration:underline}
.auth-alt{margin-top:22px;font-size:14px;color:var(--muted)}
.auth-note{display:flex;gap:10px;align-items:center;background:var(--brand-tint);color:var(--brand-ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:18px}.auth-note svg{width:18px;height:18px;flex:0 0 auto}
.acct-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}.acct-head .me{width:44px;height:44px;font-size:15px;cursor:default}.acct-head .me:hover{box-shadow:none}
.auth-nav{display:flex;gap:10px;margin-top:18px;align-items:center}

/* hub */
.hub{max-width:1080px;margin:0 auto;padding:48px 28px 80px}
.hub-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.hub-hero h1{font:400 58px/1 var(--f-display);margin:12px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hub-hero h1 em{color:var(--brand)}
.hub-hero p{color:var(--muted);margin:0;font-size:15.5px;max-width:52ch}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:150px;transition:.14s}
.tile:hover{border-color:#B9CBC3;transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.tile b{font:400 24px/1.1 var(--f-display)}
.tile span{color:var(--muted);font-size:13.5px}
.tile.feature{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff;grid-row:span 2}
.tile.feature b{font-size:34px;color:#fff}
.tile.feature span{color:#A9C8BC}
.tile.feature .k{color:#8FE0BF}
.tile .go{margin-top:auto;font-size:13px;color:var(--brand);font-weight:600}
.tile.feature .go{color:#8FE0BF}

/* phone */
.phones{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.phone{width:320px;max-width:100%;border-radius:40px;background:#0E1A15;padding:12px;box-shadow:0 30px 60px -30px rgba(10,46,37,.5)}
.phone .scr{background:#F6F8F7;border-radius:30px;overflow:hidden;height:640px;display:flex;flex-direction:column}
.phone .notch{height:30px;display:flex;justify-content:center;align-items:center}
.phone .notch i{width:90px;height:22px;border-radius:999px;background:#0E1A15}
.p-top{padding:6px 18px 14px}
.p-top .hi{font:400 28px/1.05 var(--f-display)}
.p-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.p-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}
.p-tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:#fff;padding:8px 0 14px;font-size:10.5px;color:var(--faint)}
.p-tabs span{display:flex;flex-direction:column;align-items:center;gap:3px}
.p-tabs span.on{color:var(--brand);font-weight:600}
.p-tabs svg{width:19px;height:19px}

/* misc */
.banner{display:flex;gap:12px;align-items:center;border-radius:var(--r);padding:14px 16px;background:linear-gradient(100deg,#0A2E25,#0F6E56);color:#E3F1EB;margin-bottom:18px;flex-wrap:wrap}
.banner b{color:#fff}
.banner .btn{margin-left:auto}
.callout svg,.banner>span>svg,.attn-ic svg,.btn svg,.p-tabs svg{flex:0 0 auto}
.callout svg{width:18px;height:18px;margin-top:1px;color:var(--brand)}
.banner>span>svg{width:20px;height:20px;display:block}
.callout{border:1px dashed #BFD3CA;background:var(--brand-tint);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.matrix td,.matrix th{text-align:center}
@media (max-width:820px){.matrix td,.matrix th{padding:9px 7px;font-size:12.5px}.matrix th{letter-spacing:.02em}}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700} .no{color:var(--faint)} .part{color:var(--warn);font-weight:600}
.spark{width:100%;height:120px;display:block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--brand-deep);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(10,30,24,.38);display:none;z-index:60;align-items:flex-end;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
@media (min-width:821px){.modal-bg{align-items:center}}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:22px}
.modal h2{font:400 28px/1.1 var(--f-display);margin:0 0 4px}
.letter{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px;white-space:pre-line;font-size:13.5px;line-height:1.6;margin:14px 0}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.mobile-only{display:none}
.btn,.tile,.opt,.nav button,.seg button,.toggle,.iconbtn,.tabs button,.bnav button{box-sizing:border-box}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:18px}
.tile.wide .go{margin:0 0 0 auto}
.mono{white-space:nowrap}

/* bottom nav (phones) */
.bnav{display:none}
.drawer-bg{display:none}

@media (max-width:1080px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile.feature{grid-row:auto;grid-column:span 2}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:70;transform:translateX(-100%);transition:transform .2s;height:100%}
  body.drawer .side{transform:none}
  body.drawer .drawer-bg{display:block;position:fixed;inset:0;background:rgba(10,30,24,.4);z-index:65}
  .top{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));gap:8px;top:0}
  .search{display:none}
  .desk-only{display:none !important}
  .mobile-only{display:inline-flex}
  .page{padding:18px 16px 160px}
  .ph h1{font-size:32px}
  .ph .act{margin-left:0;width:100%}
  .g-2e,.g-3{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:23px}
  .card{padding:15px}
  .week{grid-template-columns:minmax(0,1fr)}
  .day{min-height:0}
  .oncall{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .board{grid-template-columns:repeat(9,82%)}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
  .bnav button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--faint);padding:4px 0}
  .bnav button svg{width:21px;height:21px}
  .bnav button[aria-current="page"]{color:var(--brand);font-weight:600}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-l{padding:28px 20px 30px;gap:12px}
  .auth-l h2{font-size:34px;margin-top:6px}
  .auth-r{padding:24px 16px 48px}
  .choice,.chk{grid-template-columns:minmax(0,1fr)}
  .hub{padding:28px 16px 60px}
  .hub-hero{grid-template-columns:minmax(0,1fr);gap:14px}
  .hub-hero h1{font-size:42px}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .tile.feature{grid-column:auto}
  .hide-sm{display:none}
  .legend{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  td,th{padding:10px 11px}
}
/* family app */
.fam{min-height:100vh;background:var(--bg)}
.fam-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#FFF6EF;border-bottom:1px dashed #E9B993;padding:8px 24px;font-size:13px;color:var(--ink-2)}
.fam-bar .txtlink{margin-left:auto}
.fam-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.fam-top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 24px}
.fam-brand{display:flex;align-items:center;gap:10px}
.fam-brand b{display:block;font-size:14.5px}
.fam-brand span{display:block;font-size:11.5px;color:var(--muted)}
.fam-tabs{max-width:980px;margin:0 auto;display:flex;gap:4px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.fam-tabs button{all:unset;cursor:pointer;padding:10px 12px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.fam-tabs button svg{width:16px;height:16px}
.fam-tabs button[aria-current="page"]{color:var(--ink);border-color:var(--brand);font-weight:600}
.fam-page{max-width:980px;margin:0 auto;padding:24px 24px 90px}
.fam-hero{border-radius:18px;background:linear-gradient(120deg,#0A2E25,#0F6E56);color:#E3F1EB;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;margin-bottom:16px}
.fam-hero h1{font:400 36px/1.05 var(--f-display);color:#fff;margin:0 0 4px}
.fam-hero .wk{font-size:13.5px;color:#A9C8BC}
.fam-ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#8FE0BF 0 96%,rgba(255,255,255,.15) 0);position:relative}
.fam-ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#0D4A3B}
.fam-ring span{position:relative;z-index:1;text-align:center;font-size:11px;color:#A9C8BC;line-height:1.1}
.fam-ring b{display:block;font-size:22px;color:#fff}
.bubble{max-width:80%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45}
.bubble.them{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;align-self:flex-start}
.bubble.mine{background:var(--brand);color:#fff;border-radius:14px 14px 4px 14px;align-self:flex-end}
.bubble .m{display:block;font-size:11px;opacity:.7;margin-top:3px}
.fam-bnav{display:none}
@media (max-width:820px){
  .fam-bar{padding:8px 16px}
  .fam-top-in{padding:10px 16px;gap:8px}
  .fam-tabs{display:none}
  .fam-page{padding:16px 16px 110px}
  .fam-hero{grid-template-columns:minmax(0,1fr);padding:18px}
  .fam-hero h1{font-size:30px}
  .fam-ring{display:none}
  .fam-bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
  .fam-bnav button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--faint);padding:4px 0}
  .fam-bnav button svg{width:21px;height:21px}
  .fam-bnav button[aria-current="page"]{color:var(--brand);font-weight:600}
  .fam-top .seg button{padding:5px 8px;font-size:12px}
  .fam-brand span{display:none}
  .fam-brand b{font-size:13.5px;line-height:1.2}
}
/* assistant panel */
.ast-fab{position:fixed;right:18px;bottom:84px;z-index:57;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;background:linear-gradient(135deg,#0F6E56,#1C8B6D);color:#fff;border-radius:999px;padding:12px 16px 12px 14px;font:600 14px var(--f-ui);box-shadow:0 12px 30px -10px rgba(10,46,37,.6)}

const QUESTIONS = [
  {n:1,t:'Revenue channels',st:'answered',a:'The channel is chosen by hand for each client. Live connections to payers are covered in questions 2 and 18.',src:'Oct 13 call',where:'today'},
  {n:2,t:'Claims & eligibility',st:'answered',a:'Claims, eligibility and remittance run through a clearinghouse API: “it has to”. Which clearinghouse and payers come first is question 18.',src:'Oct 13 call, v7 requirements',where:'money'},
  {n:3,t:'Family payments',st:'partly',a:'Yes. Family payments go through the Tokos platform Stripe account; insurance and Medicaid payments arrive by bank transfer to Tokos, which bills as the contracted entity (v7 PLT-05). Tokos takes 20% of every billing, claims and private pay alike (“the fee comes off of the client’s payment”); the 15% card fee is charged to the provider or agency, never to the family. Your counsel confirms the Medicaid structure before the first Medicaid claim.',q:'How should the 20% be collected on payments recorded outside Stripe (Zelle, check, cash)? We suggest taking it from the next amount Tokos sends the agency.',src:'Oct 13 call, v7, deck',where:'money-invoices'},
  {n:4,t:'Payouts',st:'partly',a:'On insurance and Medicaid claims Tokos pays each doula through Stripe Connect every 14 days, before the insurer pays. On private pay an agency usually pays its own doulas and Tokos prepares the statements; Tokos pays them when the agency asks (a setting). Solo doulas are always paid by Tokos. The doula confirms her actual hours and the coordinator approves.',q:'When an agency’s claim is paid, does the agency receive what is left after the 20% and the doula’s pay? (Doulas are contractors, v7; a final denial is taken from later payouts, v6.)',src:'Oct 13 call, v6',where:'money-payouts'},
  {n:5,t:'Agency roles',st:'answered',a:'Whoever creates the agency is its admin, and an admin can also work as a doula. Roles are fixed in the first release: Admin, Coordinator, Doula and Credentialing analyst (use “View as” to see each one). Which users are paid seats is part of question 10.',src:'Oct 13 call, v7',where:'team'},
  {n:6,t:'On-call coverage',st:'partly',a:'Admins assign a primary and a backup doula to each family and can reassign them. The Tokos calendar for shifts and overnights should replace Google Calendar.',q:'What happens when two births overlap or the backup is also busy? Do long-term clients, such as night nanny families, appear on the calendar?',src:'Oct 13 call',where:'schedule'},
  {n:7,t:'Leads & messages',st:'answered',a:'Leads should arrive on their own from calls, texts, email, the website and an AI receptionist (220+ a month). Each doula gets her own request form. Tokos sends and receives texts; the AI drafts or suggests replies, and a person sends them.',src:'Oct 13 call, v7',where:'clients'},
  {n:8,t:'Education',st:'answered',a:'Client education: handouts and sequences timed to the due date or birth date, sent through the portal or email. Provider education: training with completion tracking, and the agency policy library the AI follows.',src:'v5, v7',where:'education'},
  {n:9,t:'Health data',st:'partly',a:'Intake follows NOVA’s Client Intake Assessment. Charts are kept 3 years for private-pay clients and 10 years once tied to any claim.',q:'Who may see each chart and the intake answers: every doula on the team, only the assigned and backup doulas, or admins too?',src:'Intake form, v5 requirements',where:'client-c5'},
  {n:10,t:'Subscriptions',st:'partly',a:'An agency fee plus a price for each additional doula seat. The deck suggests $49, $79 and $129 per seat a month; pricing is “not in stone”.',q:'Which users count as paid seats: every doula and admin, or only providers who work with families? (v7 prices per provider seat but also says “no per-user fees”.) Are there trials or annual plans, and what happens on cancellation?',src:'Oct 13 call, deck, v7',where:'settings'},
  {n:11,t:'Stripe',st:'answered',a:'One Tokos platform Stripe account receives family payments; insurer payments come by bank transfer to Tokos and are matched to claims from the remittance file. Stripe Connect pays out to doulas and agencies, with early payouts when an insurer is late.',src:'Oct 13 call, v7',where:'money-payouts'},
  {n:12,t:'Family portal',st:'answered',a:'Yes, a must-have: families fill in their own forms, sign agreements, pay and message their doula.',src:'Oct 13 call',where:'fam-home'},
  {n:13,t:'Public profile & booking',st:'answered',a:'Yes. A public site with a doula directory, filters by state, service and payment, and a contact form that creates a lead. The directory itself is Phase 2 (v6); each doula’s personal lead form is in the first release.',src:'Oct 13 call, follow-up discussion',where:'site'},
  {n:14,t:'Enterprise direction',st:'partly',a:'v7 lists a read-only plan view for the first plan pilot among the first-release must-haves; the full plan workspace is Phase 2. Tokos records referrals, visits and outcomes from day one.',q:'Which state and health plan is the first pilot?',src:'v6, v7',where:'enterprise'},
  {n:15,t:'Charting',st:'partly',a:'Charts work like a health record, so a backup doula can pick up where the primary left off.',q:'Can you share the blank Birth Prenatal, Birth Log and Postpartum Visit forms, so the charts match them field by field?',src:'Oct 13 call',where:'charting'},
  {n:16,t:'Templates & SMS',st:'partly',a:'Two-way texting is needed: families text in, doulas and the AI text out.',q:'Which SMS provider (it must sign a BAA)? Can you share the template catalog, and which messages may send automatically versus after approval?',src:'Oct 13 call, v7',where:'messages'},
  {n:17,t:'Lead sources',st:'answered',a:'Tokos reads the NOVA inbox, web forms, calls and texts and creates leads, routes them by service and drafts the first reply for approval. Same answer as question 7.',src:'Oct 13 call, v7',where:'clients'},
  {n:18,t:'Live insurance',st:'partly',a:'Live submission through one clearinghouse is step 2 of the v7 build order, so it is in the first release.',q:'Which clearinghouse, and which plans in Maryland, DC and Virginia come first?',src:'v7',where:'money'},
  {n:19,t:'Moving off Dubsado',st:'partly',a:'Yes, Tokos replaces Dubsado at pilot launch with no parallel run: forms, contracts with e-signature, proposals and booking. Every client, signed contract, invoice and payment history comes across before cutover.',q:'What is the pilot launch date?',src:'v7 (Module 19)',where:'forms'},
  {n:20,t:'Source documents',st:'open',q:'We have v7, the deck and the call. Can you share the supporting documents they reference: Pipeline Spec, Template Guide and Catalog, Billing Code Reference, Insurance Routing Rules, NOVA Data Model and the blank charting forms?',src:'',where:'questions'},
  {n:21,t:'Sign-up & approval',st:'answered',a:'Agencies and solo doulas sign up on their own, with no approval step. Two doulas who back each other up can already be an agency. Doulas join an agency by invitation, and sign-in uses two-step verification.',src:'Oct 13 call, v7',where:'signup'},
  {n:22,t:'States',st:'answered',a:'Yes, agencies and doulas can work in several states. Each doula’s enrollment is tracked per plan and state, so she is only matched with families and claims she can bill for.',src:'Oct 13 call, v7',where:'signup'},
  {n:23,t:'Hosting & stack',st:'partly',a:'Auth0, AWS, Terraform and GitHub in Tokos-owned accounts. RapidDev builds the infrastructure, compliance controls, the app and the AI; Brian’s team owns the AWS architecture and builds the iOS shell.',q:'Who builds the Android shell?',src:'v7, Oct 13 call',where:'settings'},
  {n:24,t:'AI model',st:'answered',a:'AI runs inside Tokos’s own AWS environment under a BAA, and its cost is included in the subscription, so providers never see usage. The model itself is our choice (Bedrock).',src:'v7 AIO-07, AIO-08',where:'assistant'},
  {n:25,t:'Existing prototype',st:'open',q:'Should we reuse any code or data from the earlier prototypes (Firia, Neon database), or start fresh?',src:'',where:'questions'},

  return `

function astReply(text){

function soloize(el){
  if (S.role!=='solo' || !el) return;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ let t=n.nodeValue, o=t; SOLO_TXT.forEach(([re,r])=>{ t=t.replace(re,r); }); if(t!==o) n.nodeValue=t; });
